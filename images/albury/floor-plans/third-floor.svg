<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">THIRD FLOOR floor plan</title>
  <desc id="desc">Canon schematic of Albury House, north at the top, showing Nos. 30 and 32—the matched semi-detached Victorian pair rebuilt as one—and the relationship between principal and service circulation.</desc>
  <rect width="1600" height="1000" fill="#0b0b0a"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity=".025" stroke-width="1"/></pattern>
  </defs>
