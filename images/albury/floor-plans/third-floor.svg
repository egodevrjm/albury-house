  <text x="72" y="88" fill="#8f877a" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="2.1">FRIENDS' FLOOR · FIVE ENSUITE ROOMS · SALON · UPPER-HOUSE SERVICE HUB</text>
