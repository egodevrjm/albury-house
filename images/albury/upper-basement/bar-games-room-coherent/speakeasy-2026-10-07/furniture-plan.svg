<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1040" viewBox="0 0 1540 1040" role="img" aria-labelledby="title description"><title id="title">Albury seven-table speakeasy furniture plan</title><desc id="description">Approximately sixty by thirty-eight feet. Seven small cafe tables replace the navy sofa and poker table. Billiards stays southwest; shuffleboard moves south behind it. Bar remains east; permanent raised stage and piano remain north.</desc><rect x="0" y="0" width="1540" height="1040" rx="0" fill="#F6F2E9" stroke="none" stroke-width="1"/><text x="60" y="60" fill="#68776E" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">ALBURY / CLUB ALEX</text><text x="60" y="113" fill="#263A34" font-size="38" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">DEFAULT SEVEN-TABLE SPEAKEASY</text><text x="60" y="147" fill="#68776E" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Permanent raised stage, piano retained — current room configuration</text><rect x="60" y="171" width="1418" height="43" rx="6" fill="#E2E9E1" stroke="none" stroke-width="1"/><text x="80" y="199" fill="#263A34" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">APPROX. 60 × 38 FT / 18.29 × 11.58 M / 212 M²</text><text x="1454" y="199" fill="#68776E" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="end">PROPOSED FURNITURE LAYOUT</text><rect x="90" y="240" width="960" height="608" rx="0" fill="#E8DDC9" stroke="none" stroke-width="1"/><line x1="170" y1="240" x2="170" y2="848" stroke="#D8CEBB" stroke-width="0.5"/><line x1="250" y1="240" x2="250" y2="848" stroke="#D8CEBB" stroke-width="0.5"/><line x1="330" y1="240" x2="330" y2="848" stroke="#D8CEBB" stroke-width="0.5"/><line x1="410" y1="240" x2="410" y2="848" stroke="#D8CEBB" stroke-width="0.5"/><line x1="490" y1="240" x2="490" y2="8