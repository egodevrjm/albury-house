"start">Billiards retained</text><text x="1115" y="517" fill="#68776E" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Shifted slightly towards the stage</text><text x="1115" y="539" fill="#68776E" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">to free the games bay behind it.</text><text x="1115" y="579" fill="#263A34" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Shuffleboard at entrance end</text><text x="1115" y="604" fill="#68776E" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Runs east–west behind the billiards.</text><text x="1115" y="626" fill="#68776E" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Its former northwestern position is clear.</text><text x="1115" y="666" fill="#263A34" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Speakeasy furniture</text><text x="1115" y="691" fill="#68776E" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Oxblood chairs, walnut tables,</text><text x="1115" y="713" fill="#68776E" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">small lamps and candlelight.</text><text x="1115" y="753" fill="#263A34" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Bar and performance retained</text><text x="1115" y="778" fill="#68776E" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">East bar, eight stools, north stage,</text><text x="1115" y="800" fill="#68776E" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">piano and northwest pinball / art.</text><line x1="60" y1="915" x2="1476" y2="915" stroke="#BBC5BA" stroke-width="1"/><text x="60" y="947" fill="#68776E" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">SOURCE: REFRESH room owners and visuals/club-alex/default-layout.json. This is the current default.</text><text x="60" y="976" fill="#68776E" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Concept study: furniture footprints, cue space and stage size are indicative. Door positions are omitted.</text><text x="60" y="1004" fill="#68776E" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Shuffleboard is at the entrance end. The raised stage and seven tables are the everyday speakeasy layout.</text></svg>