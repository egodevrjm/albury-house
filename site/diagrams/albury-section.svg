<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-labelledby="title desc"><title id="title">Albury: seven levels, one house</title><desc id="desc">Schematic side section with five levels above ground, the Music Nobile isolated acoustically, and two basements extending beneath the terrace and near garden. Not to scale.</desc><defs><pattern id="soil" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 16L16 0" stroke="#d3c8b5" stroke-width="1"/></pattern></defs><rect width="1240" height="820" fill="#f4f0e7"/><g font-family="Arial,sans-serif" fill="#25342c"><text x="45" y="52" font-family="Georgia,serif" font-size="32">Seven levels, one house</text><text x="45" y="82" font-size="14" fill="#67675c">A schematic side section · Upper Phillimore to the rear garden · not to scale</text><rect x="260" y="480" width="925" height="195" fill="url(#soil)"/><path d="M280 120L310 99H690L720 120" fill="#d4cec0" stroke="#25342c" stroke-width="3"/><rect x="280" y="120" width="440" height="72" fill="#e4e7db" stroke="#25342c" stroke-width="2"/><text x="45" y="161.0" font-size="17">Top floor</text><path d="M235 156.0H273" stroke="#a2957c"/><text x="300" y="161.0" font-size="17">Private rooms · fashion · writing</text><rect x="280" y="192" width="440" height="72" fill="#ece4da" stroke="#25342c" stroke-width="2"/><text x="45" y="233.0" font-size="17">Third floor</text><path d="M235 228.0H273" stroke="#a2957c"/><text x="300" y="233.0" font-size="17">Five guest rooms · friends’ salon</text><rect x="280" y="264" width="440" height="72" fill="#e4e7db" stroke="#25342c" stroke-width="2"/><text x="45" y="305.0" font-size="17">Second floor</text><path d="M235 300.0H273" stroke="#a2957c"/><text x="300" y="305.0" font-size="17">Guest suites</text><rect x="280" y="336" width="440" height="72" fill="#ded9e2" stroke="#25342c" stroke-width="2"/><text x="45" y="377.0" font-size="17">Music Nobile</text><path d="M235 372.0H273" stroke="#a2957c"/><text x="300" y="377.0" font-size="17">Studio &amp; support</text><rect x="280" y="408" width="440" height="72" fill="#ece4da" stroke="#25342c" stroke-width="2"/><text x="45" y="449.0" font-size="17">Raised ground</text><path d="M235 444.0H273" stroke="#a2957c"/><text x="300" y="449.0" font-size="17">Reception · dining · kitchen</text><rect x="280" y="480" width="820" height="85" fill="#d8dfd6" stroke="#25342c" stroke-width="2"/><text x="45" y="527.5" font-size="17">B1 · Upper basement</text><path d="M235 522.5H273" stroke="#a2957c"/><text x="300" y="527.5" font-size="17">Club rooms · cinema · service</text><rect x="280" y="565" width="690" height="85" fill="#d1ddd9" stroke="#25342c" stroke-width="2"/><text x="45" y="612.5" font-size="17">B2 · Lower basement</text><path d="M235 607.5H273" stroke="#a2957c"/><text x="300" y="612.5" font-size="17">Pool · gym · spa · reserve cellar</text><rect x="520" y="270" width="190" height="131" fill="#ded9e2"/><path d="M520 336V270H710V401H520" fill="none" stroke="#8b748b" stroke-dasharray="5 4" stroke-width="2"/><text x="537" y="298" font-size="15">Live-room upper</text><text x="537" y="320" font-size="15">volume · no floor</text><text x="552" y="379" font-size="16">Live room</text><rect x="289" y="343" width="422" height="58" fill="none" stroke="#8b748b" stroke-dasharray="5 4" stroke-width="2"/><text x="757" y="366" font-size="17" fill="#713e43">Acoustically isolated floor</text><path d="M718 366H745" stroke="#8b748b"/><path d="M260 480H1190" stroke="#526747" stroke-width="5"/><text x="748" y="451" font-size="17">Terrace &amp; near garden</text><text x="748" y="473" font-size="12">Engineered roof above the basements</text><text x="752" y="516" font-size="16">Approx. 11,000–12,000 sq ft</text><text x="752" y="542" font-size="13">Extends roughly 85 ft beyond the house</text><text x="738" y="600" font-size="15">Approx. 9,000–10,000 sq ft</text><text x="738" y="625" font-size="12">Roughly 60 ft beyond the house</text><text x="1000" y="601" font-size="14">Retained ground</text><text x="1000" y="625" font-size="12">Beyond each footprint</text><text x="280" y="705" font-size="17">Five above-ground levels: approximately 29,000–30,000 sq ft</text><text x="280" y="735" font-size="17">Whole house: approximately 50,000 sq ft, including both basements</text><text x="45" y="788" font-size="13" fill="#67675c">Programme and approximate extents only. This is not a measured construction, structural or escape-route drawing.</text></g></svg>