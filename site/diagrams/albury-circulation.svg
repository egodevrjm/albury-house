<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title"><title id="title">Four routes through Albury</title><rect width="1200" height="490" fill="#e4e7db"/><g font-family="Arial,sans-serif" fill="#25342c"><text x="35" y="48" font-family="Georgia,serif" font-size="30">Four routes through Albury</text><text x="35" y="77" font-size="14">A connection diagram, not a plan of the stairs or lift shafts</text><text x="380" y="116" text-anchor="middle" font-size="18">Main stair</text><text x="380" y="139" text-anchor="middle" font-size="11">Guests &amp; everyday movement</text><path d="M380 166V409" stroke="#253f30" stroke-width="4"/><text x="598" y="116" text-anchor="middle" font-size="18">Passenger lift</text><text x="598" y="139" text-anchor="middle" font-size="11">Step-free travel</text><path d="M598 166V409" stroke="#856b49" stroke-width="4"/><text x="816" y="116" text-anchor="middle" font-size="18">Service stair</text><text x="816" y="139" text-anchor="middle" font-size="11">Household circulation</text><path d="M816 166V409" stroke="#713e43" stroke-width="4"/><text x="1034" y="116" text-anchor="middle" font-size="18">Goods lift</text><text x="1034" y="139" text-anchor="middle" font-size="11">Linen, food &amp; equipment</text><path d="M1034 166V409" stroke="#546976" stroke-width="4"/><text x="35" y="174" font-size="15">Top floor</text><path d="M245 169H1095" stroke="#c9cdbd"/><circle cx="380" cy="169" r="6" fill="#253f30"/><circle cx="598" cy="169" r="6" fill="#856b49"/><circle cx="816" cy="169" r="6" fill="#713e43"/><circle cx="1034" cy="169" r="6" fill="#546976"/><text x="35" y="214" font-size="15">Third floor</text><path d="M245 209H1095" stroke="#c9cdbd"/><circle cx="380" cy="209" r="6" fill="#253f30"/><circle cx="598" cy="209" r="6" fill="#856b49"/><circle cx="816" cy="209" r="6" fill="#713e43"/><circle cx="1034" cy="209" r="6" fill="#546976"/><text x="35" y="254" font-size="15">Second floor</text><path d="M245 249H1095" stroke="#c9cdbd"/><circle cx="380" cy="249" r="6" fill="#253f30"/><circle cx="598" cy="249" r="6" fill="#856b49"/><circle cx="816" cy="249" r="6" fill="#713e43"/><circle cx="1034" cy="249" r="6" fill="#546976"/><text x="35" y="294" font-size="15">Music Nobile</text><path d="M245 289H1095" stroke="#c9cdbd"/><circle cx="380" cy="289" r="6" fill="#253f30"/><circle cx="598" cy="289" r="6" fill="#856b49"/><circle cx="816" cy="289" r="6" fill="#713e43"/><circle cx="1034" cy="289" r="6" fill="#546976"/><text x="35" y="334" font-size="15">Raised ground</text><path d="M245 329H1095" stroke="#c9cdbd"/><circle cx="380" cy="329" r="6" fill="#253f30"/><circle cx="598" cy="329" r="6" fill="#856b49"/><circle cx="816" cy="329" r="6" fill="#713e43"/><circle cx="1034" cy="329" r="6" fill="#546976"/><text x="35" y="374" font-size="15">B1 · Upper basement</text><path d="M245 369H1095" stroke="#c9cdbd"/><circle cx="380" cy="369" r="6" fill="#253f30"/><circle cx="598" cy="369" r="6" fill="#856b49"/><circle cx="816" cy="369" r="6" fill="#713e43"/><circle cx="1034" cy="369" r="6" fill="#546976"/><text x="35" y="414" font-size="15">B2 · Lower basement</text><path d="M245 409H1095" stroke="#c9cdbd"/><circle cx="380" cy="409" r="6" fill="#253f30"/><circle cx="598" cy="409" r="6" fill="#856b49"/><circle cx="816" cy="409" r="6" fill="#713e43"/><circle cx="1034" cy="409" r="6" fill="#546976"/><text x="35" y="465" font-size="13">Music Nobile and the private top floor have controlled thresholds; service stays on the rear route.</text></g></svg>